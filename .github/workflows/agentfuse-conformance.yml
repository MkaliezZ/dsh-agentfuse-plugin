name: AgentFuse conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pinned-dsh-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AgentFuse plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out pinned DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: dsh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml

      - name: Install pinned DSH dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Overlay AgentFuse packages
        run: |
          cp -R plugin/packages/core dsh/vendor/agentfuse-core
          cp -R plugin/packages/dsh-agentfuse dsh/packages/guard/agentfuse

      - name: Link AgentFuse core into the adapter
        run: |
          mkdir -p dsh/packages/guard/agentfuse/node_modules/@agentfuse
          ln -s ../../../../../vendor/agentfuse-core dsh/packages/guard/agentfuse/node_modules/@agentfuse/core

      - name: Install published DeepSeek packages for runtime resolution
        run: |
          mkdir -p /tmp/dsh-published && cd /tmp/dsh-published && npm init -y >/dev/null
          npm install --no-save --no-package-lock \
            @deepseek-ai/cordis@^4.0.1 \
            @deepseek-ai/schemastery@^3.18.1 \
            @deepseek-ai/dsh-agent@^0.1.0-rc.6 \
            @deepseek-ai/dsh-invariants@^0.1.0-rc.6 \
            @deepseek-ai/dsh-llm@^0.1.0-rc.6 \
            @deepseek-ai/dsh-session@^0.1.0-rc.6 \
            @deepseek-ai/dsh-system-prompt@^0.1.0-rc.6 \
            @deepseek-ai/dsh-tools@^0.1.0-rc.6 \
            @deepseek-ai/dsh-user-approval@^0.1.0-rc.6
          cd "$GITHUB_WORKSPACE/dsh"
          for p in cordis schemastery dsh-agent dsh-invariants dsh-llm dsh-session dsh-system-prompt dsh-tools dsh-user-approval; do
            rm -rf "node_modules/@deepseek-ai/$p"
            cp -R "/tmp/dsh-published/node_modules/@deepseek-ai/$p" "node_modules/@deepseek-ai/$p"
          done

      - name: Build AgentFuse packages
        working-directory: dsh
        run: node node_modules/typescript/bin/tsc -b vendor/agentfuse-core packages/guard/agentfuse

      - name: Run core, adapter, and conformance tests
        working-directory: dsh
        run: |
          node node_modules/vitest/vitest.mjs run \
            --root vendor/agentfuse-core \
            --config vitest.config.ts
          node node_modules/vitest/vitest.mjs run \
            packages/guard/agentfuse/tests/agentfuse.spec.ts \
            packages/guard/agentfuse/tests/conformance.spec.ts

      - name: Render conformance matrix
        working-directory: dsh
        run: node --import tsx packages/guard/agentfuse/tests/run-conformance.ts
